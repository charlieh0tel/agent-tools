[project]
name = "agent-tools"
version = "1.0.1"
description = "Small CLI tools for working with coding agents (Claude Code, Codex)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-ps = "agent_ps:main"
claude-sync = "claude_sync:main"

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["agent_ps.py", "claude_sync.py"]

[tool.ruff]
# Pinned here and in the dev group: a new ruff can add rules or change
# formatting, which should be a deliberate bump, not a surprise in CI.
required-version = "==0.16.10"
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
