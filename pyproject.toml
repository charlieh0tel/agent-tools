[project]
name = "agent-tools"
version = "1.0.1"
description = "Small CLI tools for working with coding agents (Claude Code, Codex)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-ps = "agent_ps:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["agent_ps.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
