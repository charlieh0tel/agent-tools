name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # uv is detected from uv.lock; ruff and pytest come from the locked dev group.
  python-ci:
    uses: charlieh0tel/deb-workflows/.github/workflows/python-ci.yml@v1

  # Builds the .deb on every run; publishes a GitHub Release on v* tags.
  build-deb:
    uses: charlieh0tel/deb-workflows/.github/workflows/dpkg-build-deb.yml@v1
    # Scoped to this job. At workflow level it would also be granted to the
    # dispatch job below, which authenticates with its own PAT and writes
    # nothing here.
    permissions:
      contents: write
    with:
      artifact-name: agent-tools

  trigger-apt-repo:
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      # workflow_dispatch, not repository_dispatch: the token then needs
      # Actions: write on apt-repo instead of Contents: write, which could
      # push a commit to the workflow that runs with the GPG signing key.
      - name: Trigger APT repo rebuild
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::APT_REPO_TOKEN is not set; the daily apt-repo rebuild will pick up this release instead"
            exit 0
          fi
          gh workflow run update-repo.yml -R charlieh0tel/apt-repo
